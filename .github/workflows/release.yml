name: Release
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest  # You can choose a different runner if needed
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Shaded JAR
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ./gradlew :client:shadowJar -Pcupidbot.commit.sha=$COMMIT_SHA


      - name: Read cupidbot.version from Gradle
        id: version
        run: |
          V=$(./gradlew -q properties --console=plain | sed -n 's/^cupidbot.version: //p')
          if [ -z "$V" ]; then V=$(grep '^cupidbot.version=' gradle.properties | cut -d= -f2); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Using version: $V"

      - name: Prepare artifact name
        run: |
          SRC=$(echo runelite-client/build/libs/client-*-shaded.jar)
          DEST=runelite-client/build/libs/cupidbot-${{ steps.version.outputs.version }}.jar
          cp "$SRC" "$DEST"

      - name: Create Release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "${{ steps.version.outputs.version }}"
          prerelease: false
          title: "Release ${{ steps.version.outputs.version }}"
          files: |
            runelite-client/build/libs/cupidbot-*.jar
